name: Weekly trade refresh

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Run weekly refresh
        run: node scripts/refresh-trades.mjs

      - name: Build
        run: npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/generated/live-trades.js
          git diff --cached --quiet || git commit -m "chore: weekly trade refresh"

      - name: Push changes
        run: git push
